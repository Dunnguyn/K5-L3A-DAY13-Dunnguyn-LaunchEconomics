# Nguyễn Thị Thùy Dung · 2A202603552 · L3A · Individual Lab
# CP4 COMPLETE về thiết kế/code/QA; kế hoạch Planned, chưa phê duyệt hoặc thực hiện.
# Gate 2a chỉ xét duyệt kế hoạch pilot; không phải kết luận hiệu quả nhân quả.
# Nguồn: CHECKPOINTS CP4, RUBRIC C4/C8, docs/du_lieu_va_cong_thuc.md;
# docs/Lab13_Huong_dan_chi_tiet_buoi_chieu.md, Nhiệm vụ D; tính bởi src/lab13.py.
# D1-a: co_mau(.70,.75,.05,.80)=1251/arm, hai phía, giả định quan sát độc lập.
# D1-b: m=75, ICC=.02 => DE=2.48; ceil(1251*2.48)=3103 raw/arm;
# ceil(3103/75)=42 staff/arm => 3150 raw được phân/arm, 84 staff > 40: không khả thi.
# D1-c: 20 staff/arm => effective < 20/.02=1000 < 1251 ở mọi m hữu hạn.
# D1-d: 6 depot/arm => effective < 300 < 1251; chỉ 6 cụm/arm: không chọn.
# D1-e: co_mau(.70,.76)=859 effective/arm; m>=ceil(859*.98/(20-859*.02))=299;
# DE=6.96; raw=5980/arm, 11960 tổng; effective=859.195402/arm, không phải 859 raw.
# Power Cohen h/NormalIndPower: true +6pp=0.800965; true +5pp=0.641755.
# Xấp xỉ DE chưa thay phân tích cluster-aware; chỉ 20 cụm/arm, cần hiệu chỉnh hữu hạn.
# D2-01: treatment/control cùng tuần, cùng policy và depot; cân bằng loại yêu cầu.
# D2-02: staff randomization 20:20, seed 20261122 khóa trước; stratify depot theo roster thật.
# D2-03: phân quyền staff_id, log open/use, audit trái nhóm; kiểm soát chia sẻ gợi ý.
# D2-04: khóa metric, eligibility, MDE, N, assignment, ITT, missing/crossover, stop rules, ngày.
# D2-05: 20+20=40 cụm; trace lab chỉ có 20 staff/6 depot, chưa phải roster triển khai 40 staff.
# D3: overall=51/1200=4.25%; eligible=39/982=3.971487% từ trace lab giả lập.
# Ngưỡng đề xuất: reopen treatment-control >=2pp hoặc treatment >6%; không đặt 3% tuyệt đối.
# Các sự cố giao dịch nghiêm trọng dừng ngay, không chờ cửa sổ 7 ngày hoặc mẫu tối thiểu.
# Khả thi 6 depot, giả định phân bố đều: 1500*(6/12)=750 requests/ngày;
# eligible=750*982/1200=613.75/ngày (không phải số đo thực tế, chưa trừ exclusion khác).
# Lịch cũ 14 ngày chỉ 8592.5 raw, thiếu3367.5; 214.8125/staff <299 nếu chia đều40 staff.
# Cần ít nhất ceil(11960/613.75)=20 ngày ở100% capture; capture80% cần25 ngày có lưu lượng.
# Main mới dự kiến28 ngày: 17185 raw trước capture; 13748 nếu capture80%, 343.7/staff bình quân.
# Chỉ20 ngày hoạt động ở capture80% cho9820 raw: thiếu mẫu; không đồng nhất ngày lịch/ngày có coverage.
# Staff phân bố đều40/12 =>6 depot chỉ20 staff; cần xác minh/điều chuyển thêm20 để có40 trước khóa roster.
# Lịch và capture80% chỉ là giả định; số mẫu từng staff, arm, cụm và follow-up là điều kiện quyết định.
pilot:
  owner: "Giám đốc vận hành LogiX-VN"
  scope: >-
    Chỉ noi_dia và hang_nang. CPS so baseline 12000 VND/request lần lượt khoảng
    0.225x và 0.685x (simulated); loại quoc_te (1.876x) và doi_tac (0.851x,
    success 54.41%, điều khoản riêng). Kịch bản chính dự kiến tại 6 depot D01-D06,
    cần xác minh đúng phạm vi với LogiX; không coi các depot của trace là phạm vi đã được duyệt.
    Cần 40 CSKH làm việc trong 6 depot trước phân nhóm; theo giả định phân bố đều hiện chỉ20,
    nên phải xác minh năng lực hoặc phương án điều chuyển thêm20 từ depot khác trước khi khóa roster;
    cần roster thật staff_id/depot, giờ làm, lịch sử khối lượng và loại yêu cầu trước khi chia.
    Eligibility áp dụng hai arm: yêu cầu mới trong phạm vi, một request_id duy nhất,
    policy_version hiện hành, dữ liệu truy cập <=12 tháng; âm thanh chưa chuyển thành chữ,
    bảo hiểm đối tác, quốc tế hoặc thiếu dữ liệu được handoff nhân viên kèm tóm tắt.
    Ghi mọi exclusion và lý do trước khi biết outcome; không loại lỗi treatment sau phân nhóm.
  assignment:
    unit: staff
    control_share: 0.5
    randomized: true
    status: Planned_not_executed
    clusters_per_arm: 20
    seed: 20261122
    stratification: >-
      Khóa roster 40 staff duy nhất, mỗi người một depot và một arm trong toàn kỳ.
      Sắp roster theo staff_id; phân tầng depot. Dùng bộ sinh PCG64 với seed đã khóa,
      sinh tối đa 10000 phân bổ 20:20; giữ phân bổ lệch số người trong mỗi depot <=1,
      mỗi depot có cả hai arm (depot có <2 người phải tuyển bổ sung hoặc sửa thiết kế trước).
      Chọn ngẫu nhiên một phân bổ hợp lệ với cùng RNG; nếu không có thì dừng thiết kế,
      không chọn thủ công. Nếu có covariate đáng tin từ 4 tuần trước, thêm ràng buộc cân bằng
      khối lượng/type mix với tiêu chí khóa trước; không tối ưu sau khi xem outcome.
      Lưu roster hash, code/version RNG, seed, toàn bộ mapping và audit thời điểm khóa.
    prerequisite: >-
      CSV lab chỉ có 20 staff ở D01-D06, không đủ để thực hiện phân bổ 40 staff.
      Chưa có mapping treatment/control thực tế; không coi sample trace là roster tuyển dụng.
      Nhu cầu40 staff trong6 depot là điều kiện chưa xác nhận, không phải nguồn lực sẵn có.
      40 là toàn bộ nguồn lực CSKH giả định của12 depot; điều chuyển20 người không tự khả thi
      nếu làm mất coverage của6 depot ngoài pilot. Phải xác minh lịch làm và năng lực phục vụ
      toàn mạng trước duyệt roster; không giả định đã có thêm nhân sự hoặc doanh nghiệp đã chấp thuận.
      Nếu chỉ có20 staff tổng thì10/arm có trần effective500 <859; kéo dài cũng không cứu thiết kế.
      Phương án mở tới12 depot với40 staff chỉ được xét riêng trước preregistration, cập nhật scope/lịch
      và được duyệt; không tự mở depot hoặc tăng staff sau khi nhìn outcome để đủ power.
  rollout: [0.10, 0.25, 0.50]
  primary_metric:
    name: dong_trong_24h_khong_mo_lai_7_ngay
    baseline: 0.70
    mde: 0.06
    alpha: 0.05
    power: 0.80
    n_per_arm: 859
    design_effect: 6.96
    clusters_per_arm: 20
    raw_n_per_arm: 5980
    raw_n_total: 11960
    min_requests_per_staff: 299
    definition: >-
      Numerator: request đủ điều kiện đóng trong 24h từ lúc nhận và không mở lại trong 7 ngày
      từ lúc đóng. Denominator: tất cả request đủ điều kiện thuộc 40 staff đã randomize
      trong kỳ chính, theo ITT; outcome chỉ chốt khi cửa sổ theo dõi đã trưởng thành.
      Baseline .70 là giả định thiết kế, không phải success tác nghiệp CP1 hoặc causal lift từ CSV.
    sample_size_limits: >-
      859 là effective/arm; 5980 là raw/arm nếu 20 cụm bằng nhau, 299 requests/cụm.
      Thu tất cả eligible trong kỳ chính; theo dõi từng staff đạt tối thiểu 299, không bỏ outcome xấu.
      Nếu kích thước cụm lệch, tính lại DE với CV kích thước cụm và sensitivity ICC trước quyết định;
      công thức bằng cụm không bảo đảm power cho mọi phân bố. Nếu thiếu cụm, thiếu mẫu hoặc thiếu
      follow-up thì không kết luận hiệu lực; kéo dài/thiết kế lại và lùi decision date có audit.
  identifiability:
    concurrent_control: >-
      Hai arm chạy song song cùng tuần/cùng depot, cùng chính sách hoàn phí và điều kiện vận hành.
      Control làm thủ công; case routing dùng rule chung không dựa outcome hoặc arm.
      Ghi depot, staff, type mix, ca làm và thay đổi policy; thay đổi khẩn cấp áp dụng đồng đều và log.
    spillover_risk: >-
      Nhân viên có thể chia sẻ câu trả lời; control có thể truy cập nhầm agent; quy trình chung có thể đổi.
      Chặn agent theo staff_id/arm, log agent_open/agent_use/access_denied với trace_id,
      audit hàng ngày số control dùng agent, huấn luyện không chia sẻ output giữa arm;
      sự cố quyền truy cập phải đóng trước khi mở rộng. Request randomization dễ spillover nên không chọn.
    predeclared: >-
      Trước 2026-11-30, khóa primary metric, eligibility, MDE .06, ICC .02, 20+20 cụm,
      raw/effective N, seed và thuật toán, thời kỳ chính, ITT, phân tích điều chỉnh staff,
      missing/crossover, các luật dừng và ngày quyết định trong bản prereg có version/hash.
      Chưa thực sự prereg hoặc phân nhóm; mọi sửa đổi cần phê duyệt trước mở dữ liệu efficacy,
      lưu lý do và lùi lịch nếu cần, không đổi ngưỡng theo kết quả thuận lợi.
  stop_rules:
    - >-
      SR-01 NẾU có >=1 ca đã xác minh hoàn trùng, thông báo thành công khi ledger chưa commit,
      hoàn sai tiền hoặc bảng giá cũ gây sai tiền; HOẶC tỷ lệ mở lại treatment-control >=0.02
      hay treatment >0.06 trên cohort trưởng thành có >=200 requests/arm
      TRONG từng sự cố (khẩn cấp ngay) hoặc lần rà hằng tuần cohort đã theo dõi đủ 7 ngày
      THÌ Giám đốc vận hành hoặc người ủy quyền đã chốt tắt ghi hoàn tự động ngay, mục tiêu <=30 phút,
      chặn mở rộng, chuyển thủ công và đối soát ledger; điều tra cache/idempotency/notification,
      chỉ mở lại khi sửa lỗi, replay test và được Giám đốc vận hành duyệt
      KHÔNG THÌ tiếp tục giám sát, chỉ xét mở rộng khi cohort đủ mẫu, đủ follow-up,
      không có sự cố pending và mọi gate còn lại đạt; thiếu dữ liệu thì giữ bước, không mở rộng.
    - >-
      SR-02 NẾU variable CPS đo thật >8000 VND/success trong mỗi tuần của hai tuần lịch liên tiếp
      cùng phiên bản can thiệp và scope, mỗi tuần có >=100 success treatment trưởng thành,
      hoặc CPS vô hạn do 0 success trong cohort có >0 requests đã trưởng thành
      TRONG cửa sổ tuần lịch không chồng lấn (0 success xử lý ngay kỳ tuần đó)
      THÌ Giám đốc vận hành dừng mở rộng; Product Manager và Finance Lead đối soát token/tool,
      phút review/rework đo thật, trong 3 ngày đề xuất thu hẹp noi_dia hoặc giới hạn retry <=2;
      thay đổi can thiệp sau khi khóa phải version lại và đánh giá tác động lên ITT, không gộp tùy tiện
      KHÔNG THÌ giữ bước nếu thiếu mẫu chi phí hoặc thiếu tuần trưởng thành; nếu dữ liệu hiện có
      nằm trong ngưỡng và các safety/usage gate đạt thì Giám đốc vận hành mới xét mở rộng;
      gate ramp dùng tuần mới nhất đủ mẫu trong ngưỡng; chưa đủ hai tuần thì chưa kết luận
      kinh tế đầy đủ, không kết luận từ CPS simulated.
      Không bỏ qua tuần thiếu mẫu để ghép thành hai tuần liên tiếp; khi thiếu thì giữ rollout.
      Hai tuần kinh tế chính là hai cohort tuần không chồng lấn của main50%, không dùng một
      cohort14 ngày như hai tuần; thay đổi can thiệp cần version/audit và đánh giá lại kế hoạch.
    - >-
      SR-03 NẾU số suggestion được staff sửa hoặc bỏ / số suggestion đã review >0.40,
      với >=100 suggestion reviewed duy nhất
      TRONG một tuần lịch không chồng lấn, đo treatment theo suggestion_id
      THÌ Giám đốc vận hành giữ rollout; Trưởng nhóm CSKH phỏng vấn 5 staff trong 3 ngày,
      phân tích trace/nguyên nhân, đề xuất sửa và audit lại >=100 suggestion tuần tiếp theo;
      chỉ xin mở rộng khi tỷ lệ <=0.40, không còn lỗi quyền truy cập và safety/economic gate đạt
      KHÔNG THÌ tiếp tục tuần tiếp theo; thiếu 100 review thì không mở rộng,
      đủ mẫu và <=0.40 chỉ là một gate, cần Giám đốc vận hành duyệt toàn bộ gate trước mở rộng.
  interim_looks: >-
    Planned: safety giao dịch theo event thời gian thực và đối soát mỗi 5 phút; giá/cache phiên bản,
    pending ledger, handoff và thông báo được rà hằng ngày. Reopen rà thứBa với cohort trưởng thành
    đủ 7 ngày và >=200 requests/arm; nếu quá ít thì giữ bước và báo cả số đếm, không kết luận an toàn.
    Chốt reopen/cost theo cohort tuần đã đủ tối đa1 ngày đóng +7 ngày theo dõi, rồi rà thứBa
    sau ngày trưởng thành cuối cùng; không chốt sớm sáng thứHai khi request cuối chưa hết cửa sổ.
    Usage rà thứBa theo tuần lịch kết thúc; các cohort không chồng lấn; technical cost bất thường >=2x
    median theo type trong 7 ngày trước, >=30 requests/type/ngày, cần điều tra trong ngày và giữ mở rộng.
    Nếu chưa có lịch sử 7 ngày thì so ngân sách kỹ thuật đã khóa, không tạo baseline giả.
    Mỗi look ghi mẫu số/missing, arm contamination, cluster balance và quyết định có người duyệt.
    Không p-value efficacy giữa kỳ hoặc optional stopping; chỉ phân tích primary một lần sau đủ mẫu,
    follow-up và QA. Các lần xem safety/cost/usage không được gọi là kiểm định efficacy chính thức.
  rollback: >-
    Planned: Giám đốc vận hành hoặc người ủy quyền kích hoạt feature flag/refund-write kill switch,
    revoke quyền tạo lệnh và xác minh không còn job ghi mới, mục tiêu <=30 phút cần diễn tập xác minh.
    Khách chuyển luồng CSKH thủ công kèm summary; không gửi lại lệnh pending mù hoặc tự hoàn ngược.
    Kỹ sư trưởng đối soát ledger/read-back theo transaction_id, idempotency_key và policy_version,
    tách pending/committed/failed; Finance Lead phê duyệt điều chỉnh, CSKH thông báo đúng trạng thái.
    Lưu incident_id, trace_id, staff_id, timestamp, snapshot phiên bản, người ra quyết định và audit log.
    Chỉ bật lại sau replay/fault injection đạt, đối soát xong và Giám đốc vận hành phê duyệt.
  decision_date: "2027-02-18"
