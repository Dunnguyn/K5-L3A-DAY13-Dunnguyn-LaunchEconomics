  analysis_plan:
    population: "ITT: giữ staff theo arm ban đầu; tất cả eligible của kỳ chính kể cả handoff, crossover, lỗi và không sử dụng agent."
    estimator: >-
      Chênh lệch tỷ lệ request thành công treatment-control, báo 95% CI và số đếm từng arm.
      Dùng mô hình xác suất tuyến tính có fixed effects depot và covariate predeclared,
      suy luận cluster-robust CR2/Satterthwaite theo staff, sensitivity randomization inference
      đúng cơ chế phân tầng hoặc wild-cluster bootstrap. Chỉ40 cụm cần kiểm tra hiệu chỉnh hữu hạn;
      không dùng z-test độc lập trên requests rồi bỏ qua clustering.
    missing_and_crossover: >-
      Chờ outcome trưởng thành, kiểm tra timestamp và liên kết event; không coi chưa đủ 7 ngày là không mở lại.
      Khi đã đủ cửa sổ mà outcome thiếu, phân tích chính coi không đạt, báo missing theo arm/staff,
      sensitivity best/worst bounds; missing >5% ở một arm thì không kết luận hiệu lực và điều tra.
      Crossover giữ ITT arm ban đầu; báo số control truy cập và mức sử dụng thực, per-protocol chỉ bổ sung.
      Staff nghỉ/đổi depot giữ arm gốc, log attrition; không thay nhân viên tùy tiện để đạt số cụm.
    decision: >-
      Không kết luận causal lift từ trace lab. Khi đủ mẫu, follow-up, QA và assumptions,
      báo effect/CI cho primary, safety, cost, usage; Go có điều kiện chỉ khi hiệu quả có CI thấp >0,
      point estimate >=.06, mọi gate an toàn/kinh tế/sử dụng đạt và Giám đốc vận hành duyệt.
      CI còn bao gồm 0 thì Inconclusive/không mở rộng; adverse safety thì No-go/rollback.
      Thiết kế chỉ nhắm ~80% power cho .06, không bảo đảm phát hiện .05 (power~.642).
  economics_measurement: >-
    SR-02 variable CPS = (mọi token/tool của treatment eligible kể cả retry/lỗi + phút review/rework
    thực đo bằng event start/end, trừ idle theo quy tắc khóa trước, nhân lương thực xác minh)
    / số treatment eligible được giải quyết đúng, đóng và không mở lại đủ7 ngày, không sai tiền.
    Không dùng denominator primary nếu primary còn bao gồm ca sai tiền; audit đúng tiền bắt buộc.
    Cohort tuần theo lúc nhận, maturity phải đủ trước chốt; 0 success => CPS vô hạn.
    CPS này tách fixed/fallback: báo thêm total system cost với fallback một lần từ worklog nhân viên,
    không cộng lại phần rework đã bao gồm; fixed phân bổ theo thời gian/volume thực.
    8000 là ngưỡng đề xuất trên variable CPS, không phải cam kết tổng chi phí <manual12000.
    So CP1 4471.968 và B4 12414.793 chỉ là đối chiếu simulated, pilot phải dùng phút/đơn giá đo thật.
  expansion_gates: >-
    Tất cả rule Planned cần Giám đốc vận hành phê duyệt trước chạy. Không có incident pending,
    không control access chưa xử lý, safety matured >=200/arm trong ngưỡng, usage>=100 trong ngưỡng,
    cost cohort matured>=100 success và không vượt8000 ở tuần gần nhất; hai tuần liên tiếp vượt là stop.
    Bước10 chỉ4 staff có thể thiếu số mẫu tuần đầu, khi đó giữ bước cho tới đủ dữ liệu; không tự động mở.
    Main efficacy cần đủ40 cụm và raw/effective N, full follow-up; không gộp ramp để tự nhận đủ power.
    Chưa đủ40 staff trong6 depot thì chưa được bắt đầu main; gia hạn thời gian không thay điều kiện số cụm.
